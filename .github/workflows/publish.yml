name: Manual NPM Publish

on:
  workflow_dispatch:
    inputs:
      releaseType:
        description: 'Version bump (from-package resumes an interrupted publication)'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - from-package
      distTag:
        description: 'NPM distribution tag'
        required: true
        type: choice
        default: latest
        options:
          - latest
          - next
      releaseCommit:
        description: 'Original release commit SHA (required only for from-package)'
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize Actor and Release Commit
    if: github.repository == 'gemini-testing/webdriverio' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      artifact_run: ${{ steps.source.outputs.artifact_run }}
    steps:
      - name: Require Protected Master
        if: ${{ !github.ref_protected }}
        run: |
          echo '::error::npm releases require protected master'
          exit 1
      - uses: actions/github-script@v7
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            for (const username of new Set([context.actor, process.env.TRIGGERING_ACTOR])) {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ ...context.repo, username });
              if (!['write', 'admin'].includes(data.permission)) {
                throw new Error(`${username} does not have permission to release this repository`);
              }
            }
      - uses: actions/checkout@v4
        with:
          # Run authorization code from the trusted dispatch on master, never from the input.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select Trusted Release Source
        id: source
        env:
          RELEASE_TYPE: ${{ inputs.releaseType }}
          RELEASE_COMMIT: ${{ inputs.releaseCommit }}
          DIST_TAG: ${{ inputs.distTag }}
        run: |
          if [[ "$RELEASE_TYPE" == from-package ]]; then
            artifact_run=$(node scripts/check-release.mjs "$RELEASE_COMMIT" "$DIST_TAG")
            source_sha=$(git rev-parse "${RELEASE_COMMIT}^")
            echo "artifact_run=$artifact_run" >> "$GITHUB_OUTPUT"
            echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
            echo "sha=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify Test Run or Original Recovery Run
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          ARTIFACT_RUN: ${{ steps.source.outputs.artifact_run }}
        with:
          script: |
            const { checkReleaseRun } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/check-release-run.mjs`);
            await checkReleaseRun(github.rest.actions, context.repo, process.env.SOURCE_SHA, process.env.ARTIFACT_RUN);
  release:
    permissions:
      actions: read
      contents: write
    needs: [authorize]
    runs-on: ubuntu-latest
    env:
      RELEASE_TYPE: ${{ inputs.releaseType }}
      DIST_TAG: ${{ inputs.distTag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          fetch-depth: 0
          persist-credentials: ${{ inputs.releaseType != 'from-package' }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Available Versions and Create Release
        if: inputs.releaseType != 'from-package'
        run: |
          node scripts/release-packages.mjs preflight "$RELEASE_TYPE" "$DIST_TAG"
          git switch -C master
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          pnpm exec lerna version "$RELEASE_TYPE" --exact --force-publish --yes --no-push --message "Publish to npm ($DIST_TAG) from run $GITHUB_RUN_ID"
      - name: Verify Release Tags
        id: release
        run: |
          node scripts/check-release.mjs
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build and Verify
        if: inputs.releaseType != 'from-package'
        run: |
          pnpm run build
          pnpm run test:eslint
          pnpm run test:typings
          pnpm run test:unit:run
          pnpm run test:smoke
          pnpm run test:interop
          pnpm run test:release
      - name: Pack Release Tarballs
        if: inputs.releaseType != 'from-package'
        run: node scripts/release-packages.mjs pack "$RUNNER_TEMP/npm-tarballs"
      - name: Restore Original Release Tarballs
        if: inputs.releaseType == 'from-package'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.authorize.outputs.artifact_run }}
          name: npm-tarballs-${{ steps.release.outputs.sha }}
          path: ${{ runner.temp }}/npm-tarballs
      - name: Verify Final Tarballs in Clean Consumers
        run: node scripts/test-installation.mjs "$RUNNER_TEMP/npm-tarballs"
      - name: Preserve Verified Tarballs for Recovery
        if: inputs.releaseType != 'from-package'
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs-${{ steps.release.outputs.sha }}
          path: ${{ runner.temp }}/npm-tarballs/*.tgz
          if-no-files-found: error
          compression-level: 0
      - name: Verify NPM Credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          : "${NODE_AUTH_TOKEN:?NPM_TOKEN is required to publish}"
          npm whoami --registry=https://registry.npmjs.org >/dev/null
      - name: Push Release Commit and Tags
        if: inputs.releaseType != 'from-package'
        run: |
          node scripts/release-packages.mjs check "$RUNNER_TEMP/npm-tarballs" "$RELEASE_TYPE" "$DIST_TAG"
          git push --atomic --follow-tags origin HEAD:master
      - name: Publish Verified Tarballs
        run: node scripts/release-packages.mjs publish "$RUNNER_TEMP/npm-tarballs" "$RELEASE_TYPE" "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
