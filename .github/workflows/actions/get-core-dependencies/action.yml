name: 'Get Core Dependencies'
description: 'sets the node version & initializes core dependencies'
permissions:
  contents: read # to fetch code (actions/checkout)
runs:
  using: composite
  steps:
    - name: 📦 Setup pnpm
      uses: pnpm/action-setup@v4

    - name: 🐢 Setup Node
      uses: actions/setup-node@v4
      with:
        # macOS E2E suites use the same Node major as the single macOS unit/smoke leg.
        node-version: ${{ runner.os == 'macOS' && '24' || '' }}
        node-version-file: ${{ runner.os != 'macOS' && '.nvmrc' || '' }}
        cache: 'pnpm'

    - name: 🏗️ Install Dependencies
      run: pnpm install
      shell: bash

    - name: 🔧 Git Config
      run: git config --global core.autocrlf false
      shell: bash
